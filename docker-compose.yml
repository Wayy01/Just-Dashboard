# VPS Dashboard — self-hosted, single server.
#
# The topology exists to satisfy one rule: the dashboard is root-equivalent and
# must never be reachable from the open internet.
#
#   browser ──(WireGuard / VPN, or an SSH tunnel)──▶ proxy:8443
#                                                     ├─ /api  ─▶ backend:8080
#                                                     └─ /*    ─▶ frontend:3000
#
# The proxy binds to 127.0.0.1 by default, so nothing is exposed until you
# deliberately publish it on a private interface. Serving both halves from one
# origin is also what lets the SameSite=Strict session cookie and the
# same-origin WebSocket checks work as designed.

name: vps-dashboard

services:
  backend:
    build:
      context: ./backend
    image: vps-dashboard-backend:latest
    restart: unless-stopped
    # The dashboard manages the host, so it shares the host's namespaces.
    # This is the trade the product makes: without it, "restart nginx" and
    # "who is logged in" have no meaning.
    pid: host
    network_mode: host
    privileged: true
    environment:
      # Loopback only. The proxy in front of it is the single entry point.
      VPSD_ADDR: 127.0.0.1:8080
      VPSD_DATA_DIR: /var/lib/vps-dashboard
      # Required. Generate once with: openssl rand -hex 32
      VPSD_MASTER_KEY: ${VPSD_MASTER_KEY:?set VPSD_MASTER_KEY in .env}
      # Who may reach the API at all, checked before authentication.
      VPSD_ALLOWED_CIDRS: ${VPSD_ALLOWED_CIDRS:-127.0.0.1/32,::1/128}
      VPSD_TRUSTED_PROXIES: ${VPSD_TRUSTED_PROXIES:-127.0.0.1/32}
      VPSD_ALLOWED_ORIGINS: ${VPSD_ALLOWED_ORIGINS:-}
      VPSD_REQUIRE_2FA: ${VPSD_REQUIRE_2FA:-true}
      VPSD_TERMINAL_ENABLED: ${VPSD_TERMINAL_ENABLED:-true}
      # First run only: creates the bootstrap admin with this username/password.
      VPSD_BOOTSTRAP_USER: ${VPSD_BOOTSTRAP_USER:-admin}
      VPSD_BOOTSTRAP_PASSWORD: ${VPSD_BOOTSTRAP_PASSWORD:-}
      VPSD_DOCKER_HOST: unix:///var/run/docker.sock
      VPSD_COMPOSE_ROOTS: ${VPSD_COMPOSE_ROOTS:-/opt,/srv,/home}
      VPSD_GIT_ROOTS: ${VPSD_GIT_ROOTS:-/opt,/srv,/home,/root}
      VPSD_LOG_ROOTS: ${VPSD_LOG_ROOTS:-/var/log}
      VPSD_FILE_ROOTS: ${VPSD_FILE_ROOTS:-/}
      VPSD_BACKUP_DIR: ${VPSD_BACKUP_DIR:-/var/backups/vps-dashboard}
      VPSD_LOG_LEVEL: ${VPSD_LOG_LEVEL:-info}
    volumes:
      # Root-equivalent access. Everything that reaches it is authenticated,
      # capability-checked and written to the audit trail.
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:rslave
      # The dashboard addresses the server by its real paths, so the
      # directories it manages have to appear here under those same paths.
      # Without this the file manager, git discovery and compose-stack
      # scanning quietly operate on this container's own empty filesystem
      # while appearing to browse the server. Narrow this list if you have
      # narrowed VPSD_FILE_ROOTS and friends to match.
      - /home:/home
      - /opt:/opt
      - /srv:/srv
      - /root:/root
      - /etc:/etc
      - /var/log:/var/log
      - /var/lib/vps-dashboard:/var/lib/vps-dashboard
      - /var/backups/vps-dashboard:/var/backups/vps-dashboard
      - /run/systemd:/run/systemd
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

  frontend:
    build:
      context: ./frontend
    image: vps-dashboard-frontend:latest
    restart: unless-stopped
    # Shares the host namespace so the proxy can reach it on loopback, but
    # binds to loopback only — it is never reachable from outside the machine.
    # It has no host access of its own and is the one service that runs
    # unprivileged.
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    # Also on the host namespace, so it reaches both services on loopback.
    # VPSD_SITE is the one address the stack answers on, and the name its
    # certificate is issued for: leave it at localhost and tunnel in, or set
    # it to a WireGuard address such as 10.8.0.1. Never set it to 0.0.0.0.
    network_mode: host
    environment:
      VPSD_SITE: ${VPSD_SITE:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
